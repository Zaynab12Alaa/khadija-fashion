{% extends 'admin/base.html' %}
{% block title %}{% if post %}Edit Post{% else %}New Post{% endif %} — KHADIJA{% endblock %}
{% block content %}
<div class="admin-page-header">
  <h1>{% if post %}Edit Post{% else %}New Blog Post{% endif %}</h1>
  <a href="{{ url_for('admin_blog') }}" class="btn-ghost">← Back</a>
</div>
<div class="form-card">
  <form method="POST" enctype="multipart/form-data" class="admin-form">
    <div class="form-group">
      <label>Title *</label>
      <input type="text" name="title" value="{{ post.title if post else '' }}" required/>
    </div>
    <div class="form-group">
      <label>Excerpt (short preview)</label>
      <input type="text" name="excerpt" value="{{ post.excerpt if post else '' }}" placeholder="A short summary..."/>
    </div>
    <div class="form-group">
      <label>Content *</label>
      <textarea name="content" rows="10" required>{{ post.content if post else '' }}</textarea>
    </div>
    <div class="form-group">
      <label>Cover Image</label>
      <input type="file" name="image" accept="image/*"/>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">{% if post %}Save Changes{% else %}Publish Post{% endif %}</button>
      <a href="{{ url_for('admin_blog') }}" class="btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
