{% extends 'base.html' %}
{% block title %}Contact — KHADIJA{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Get In Touch</h1>
  <p class="page-sub">We'd love to hear from you.</p>
</div>
<section class="contact-section">
  <form action="{{ url_for('contact') }}" method="POST" class="contact-form">
    <div class="form-group">
      <label>Your Name</label>
      <input type="text" name="name" required placeholder="e.g. Sara"/>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" required placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea name="message" rows="6" required placeholder="What's on your mind?"></textarea>
    </div>
    <button type="submit" class="btn-primary">Send Message ✨</button>
  </form>
  <div class="contact-info">
    <h3>Khadija Fashion</h3>
    <p>📧 hello@khadijafashion.com</p>
    <p>📍 Cairo, Egypt</p>
    <p>Follow us on Instagram, TikTok & Pinterest for daily style inspo.</p>
  </div>
</section>
{% endblock %}
