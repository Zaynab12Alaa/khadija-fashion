{% extends 'admin/base.html' %}
{% block title %}Add Lookbook Item{% endblock %}
{% block content %}
<div class="admin-page-header">
  <h1>Add Lookbook Item</h1>
  <a href="{{ url_for('admin_lookbook') }}" class="btn-ghost">← Back</a>
</div>
<div class="form-card">
  <form method="POST" enctype="multipart/form-data" class="admin-form">
    <div class="form-group">
      <label>Title</label>
      <input type="text" name="title" placeholder="e.g. Spring Awakening"/>
    </div>
    <div class="form-group">
      <label>Season</label>
      <input type="text" name="season" placeholder="e.g. SS 2025"/>
    </div>
    <div class="form-group">
      <label>Image *</label>
      <input type="file" name="image" accept="image/*" required/>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Add to Lookbook</button>
      <a href="{{ url_for('admin_lookbook') }}" class="btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
