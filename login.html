<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login — KHADIJA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"/>
</head>
<body class="login-body">
<div class="login-card">
  <p class="login-logo">KH<span>A</span>DIJA</p>
  <p class="login-sub">Admin Panel</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="flash flash-{{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% endwith %}
  <form method="POST" class="login-form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required autofocus/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required/>
    </div>
    <button type="submit" class="btn-primary btn-full">Login</button>
  </form>
  <a href="{{ url_for('index') }}" class="back-link">← Back to site</a>
</div>
</body>
</html>
