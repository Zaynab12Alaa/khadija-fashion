{% extends 'base.html' %}
{% block title %}{{ post.title }} — KHADIJA{% endblock %}
{% block content %}
<article class="blog-article">
  {% if post.image %}
  <div class="article-hero">
    <img src="{{ url_for('static', filename='images/products/'+post.image) }}" alt="{{ post.title }}"/>
  </div>
  {% endif %}
  <div class="article-body">
    <p class="blog-date">{{ post.created.strftime('%B %d, %Y') }}</p>
    <h1>{{ post.title }}</h1>
    <div class="article-content">{{ post.content|replace('\n','<br>')|safe }}</div>
    <a href="{{ url_for('blog') }}" class="back-link">← Back to Journal</a>
  </div>
</article>
{% endblock %}
